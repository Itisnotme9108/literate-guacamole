<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="30" fill="#F4F8F3"/>
  
  <!-- PDF Pattern Document Icon Background -->
  <g transform="translate(60, 40)">
    <rect x="30" y="20" width="220" height="280" rx="16" fill="#FFFFFF" stroke="#A8C3A0" stroke-width="4" filter="drop-shadow(0px 8px 16px rgba(61,46,43,0.06))"/>
    <!-- Folded corner effect -->
    <path d="M 210 20 L 250 60 L 210 60 Z" fill="#E8F1E5"/>
    <path d="M 210 20 L 250 60" stroke="#A8C3A0" stroke-width="3" fill="none"/>

    <!-- Pattern Title Header -->
    <rect x="55" y="50" width="130" height="14" rx="7" fill="#A8C3A0"/>
    <rect x="55" y="72" width="90" height="8" rx="4" fill="#D2E3CC"/>

    <!-- Crochet Cardigan Illustration on Pattern -->
    <g transform="translate(45, 95)">
      <!-- Cardigan Body -->
      <path d="M 40 20 L 150 20 L 180 80 L 150 80 L 150 140 L 40 140 L 40 80 L 10 80 Z" fill="#88A77F" rx="4"/>
      <!-- V-Neck opening -->
      <polygon points="95,20 70,70 120,70" fill="#FFFFFF"/>
      <path d="M 95 20 L 70 70 M 95 20 L 120 70" stroke="#3D2E2B" stroke-width="3" stroke-dasharray="3,3"/>
      <!-- Buttons -->
      <circle cx="95" cy="85" r="4" fill="#EAD5B7"/>
      <circle cx="95" cy="110" r="4" fill="#EAD5B7"/>
      <!-- Stitch Texture -->
      <line x1="50" y1="130" x2="140" y2="130" stroke="#6F8E66" stroke-width="3" stroke-dasharray="4,4"/>
    </g>

    <!-- PDF Icon Tag -->
    <g transform="translate(160, 220)">
      <rect width="70" height="40" rx="8" fill="#E85A4F"/>
      <text x="35" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PDF</text>
    </g>
  </g>

  <!-- Tag badge -->
  <rect x="20" y="20" width="105" height="32" rx="16" fill="#E85A4F"/>
  <text x="72" y="41" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Digital PDF</text>
</svg>
