<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <rect width="900" height="1200" fill="#FAF7F2"/>
  
  <g transform="translate(250, 220)">
    <!-- Cutout Monokini Set -->
    <rect x="80" y="100" width="240" height="120" fill="#1A1615" rx="2"/>
    <!-- Connecting Lace Lace Grid -->
    <path d="M 120 220 L 120 400 M 200 220 L 200 400 M 280 220 L 280 400" stroke="#5E534C" stroke-width="2" stroke-dasharray="4,8"/>
