<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <rect width="600" height="800" fill="#FAF7F2"/>
  <rect x="20" y="20" width="560" height="760" fill="#F5EFE9" rx="8"/>
  <circle cx="300" cy="380" r="160" fill="#F4E8E5"/>
  <g transform="translate(300, 360)">
    <!-- Stem -->
    <path d="M 0 0 L 0 200" stroke="#7A9A7A" stroke-width="6"/>
    <path d="M 0 120 Q -40 80 -60 100" stroke="#7A9A7A" stroke-width="5" fill="none"/>
    <!-- Tulip Head -->
    <path d="M 0 -120 C -60 -90, -50 -10, 0 10 C 50 -10, 60 -90, 0 -120 Z" fill="#C88A7E"/>
    <path d="M 0 -120 C -30 -80, -20 0, 0 10 Z" fill="#E6B8AF"/>
    <path d="M 0 -120 C 30 -80, 20 0, 0 10 Z" fill="#B5776B"/>
  </g>
  <text x="300" y="670" font-family="Georgia, serif" font-size="22" fill="#2C2523" text-anchor="middle">Everlasting Tulip Stem</text>
  <text x="300" y="700" font-family="sans-serif" font-size="14" fill="#C88A7E" text-anchor="middle">PEACH PINK</text>
</svg>
