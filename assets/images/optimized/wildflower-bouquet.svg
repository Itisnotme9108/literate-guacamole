<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <rect width="600" height="800" fill="#FAF7F2"/>
  <rect x="20" y="20" width="560" height="760" fill="#F5EFE9" rx="8"/>
  <circle cx="300" cy="350" r="180" fill="#F4E8E5"/>
  <!-- Bouquet Stems & Flowers -->
  <g transform="translate(300, 360)">
    <!-- Kraft Paper Wrap -->
    <path d="M -80 40 L -40 220 L 40 220 L 80 40 Z" fill="#D2B48C"/>
    <path d="M -100 0 L -80 40 L 80 40 L 100 0 Z" fill="#C59B6C"/>
    <path d="M 0 40 L 0 240" stroke="#8B5A2B" stroke-width="4"/>
    <!-- Flowers -->
    <!-- Lavender -->
    <ellipse cx="-70" cy="-100" rx="14" ry="45" fill="#B39DDB"/>
    <ellipse cx="-40" cy="-140" rx="14" ry="45" fill="#9FA8DA"/>
    <!-- Rose -->
    <circle cx="0" cy="-120" r="45" fill="#E6B8AF"/>
    <circle cx="0" cy="-120" r="30" fill="#C88A7E"/>
    <!-- Daisy -->
    <circle cx="60" cy="-100" r="35" fill="#FFFDF9"/>
    <circle cx="60" cy="-100" r="18" fill="#E6C280"/>
  </g>
  <text x="300" y="670" font-family="Georgia, serif" font-size="22" fill="#2C2523" text-anchor="middle">Wildflower &amp; Lavender Bouquet</text>
  <text x="300" y="700" font-family="sans-serif" font-size="14" fill="#C88A7E" text-anchor="middle">EVERLASTING FLORALS</text>
</svg>
