<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <rect width="600" height="800" fill="#FAF7F2"/>
  <rect x="20" y="20" width="560" height="760" fill="#F5EFE9" rx="8"/>
  <circle cx="300" cy="380" r="170" fill="#FFFDF9"/>
  <!-- Brass Keyring -->
  <circle cx="300" cy="180" r="40" stroke="#D4AF37" stroke-width="12" fill="none"/>
  <rect x="294" y="220" width="12" height="60" fill="#D4AF37"/>
  <!-- Crochet Daisy -->
  <g transform="translate(300, 380)">
    <!-- Petals -->
    <ellipse cx="0" cy="-80" rx="24" ry="50" fill="#FAF7F2" stroke="#E8E1D7" stroke-width="3"/>
    <ellipse cx="56" cy="-56" rx="24" ry="50" fill="#FAF7F2" stroke="#E8E1D7" stroke-width="3" transform="rotate(45 56 -56)"/>
    <ellipse cx="80" cy="0" rx="24" ry="50" fill="#FAF7F2" stroke="#E8E1D7" stroke-width="3" transform="rotate(90 80 0)"/>
    <ellipse cx="56" cy="56" rx="24" ry="50" fill="#FAF7F2" stroke="#E8E1D7" stroke-width="3" transform="rotate(135 56 56)"/>
    <ellipse cx="0" cy="80" rx="24" ry="50" fill="#FAF7F2" stroke="#E8E1D7" stroke-width="3" transform="rotate(180 0 80)"/>
    <ellipse cx="-56" cy="56" rx="24" ry="50" fill="#FAF7F2" stroke="#E8E1D7" stroke-width="3" transform="rotate(225 -56 56)"/>
    <ellipse cx="-80" cy="0" rx="24" ry="50" fill="#FAF7F2" stroke="#E8E1D7" stroke-width="3" transform="rotate(270 -80 0)"/>
    <ellipse cx="-56" cy="-56" rx="24" ry="50" fill="#FAF7F2" stroke="#E8E1D7" stroke-width="3" transform="rotate(315 -56 -56)"/>
    <!-- Yellow Center -->
    <circle cx="0" cy="0" r="42" fill="#E6C280"/>
    <circle cx="0" cy="0" r="32" fill="#D8A855"/>
  </g>
  <text x="300" y="670" font-family="Georgia, serif" font-size="22" fill="#2C2523" text-anchor="middle">Mini Daisy Bloom Keychain</text>
  <text x="300" y="700" font-family="sans-serif" font-size="14" fill="#C88A7E" text-anchor="middle">COTTON &amp; BRASS</text>
</svg>
