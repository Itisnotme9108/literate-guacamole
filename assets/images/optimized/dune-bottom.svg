<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <rect width="900" height="1200" fill="#F5F0EB"/>
  
  <g transform="translate(250, 400)">
    <!-- Dune Beige High-leg bottom -->
    <path d="M 50 100 L 350 100 L 200 350 Z" fill="#D9C7B5"/>
    <line x1="30" y1="100" x2="370" y2="100" stroke="#1A1615" stroke-width="4"/>
    <!-- Knit Ribbing Detail -->
    <line x1="80" y1="140" x2="320" y2="140" stroke="#B8A594" stroke-width="2" stroke-dasharray="6,6"/>
    <line x1="120" y1="190" x2="280" y2="190" stroke="#B8A594" stroke-width="2" stroke-dasharray="6,6"/>
  </g>

  <text x="450" y="1120" font-family="'Playfair Display', Georgia, serif" font-size="20" letter-spacing="4" fill="#1A1615" text-anchor="middle" opacity="0.4">DUNE BOTTOM — BEIGE COTTON</text>
</svg>
