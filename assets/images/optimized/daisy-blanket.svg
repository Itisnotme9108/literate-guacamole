      <ellipse cx="40" cy="20" rx="6" ry="10" fill="#FFFFFF"/>
      <ellipse cx="40" cy="60" rx="6" ry="10" fill="#FFFFFF"/>
      <ellipse cx="20" cy="40" rx="10" ry="6" fill="#FFFFFF"/>
      <ellipse cx="60" cy="40" rx="10" ry="6" fill="#FFFFFF"/>
    </g>
