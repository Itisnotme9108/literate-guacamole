<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="30" fill="#FBF3EA"/>
  
  <g transform="translate(60, 40)">
    <rect x="30" y="20" width="220" height="280" rx="16" fill="#FFFFFF" stroke="#E07A5F" stroke-width="4" filter="drop-shadow(0px 8px 16px rgba(61,46,43,0.06))"/>
    <path d="M 210 20 L 250 60 L 210 60 Z" fill="#FCECE7"/>
    <path d="M 210 20 L 250 60" stroke="#E07A5F" stroke-width="3" fill="none"/>

    <rect x="55" y="50" width="130" height="14" rx="7" fill="#E07A5F"/>
    <rect x="55" y="72" width="90" height="8" rx="4" fill="#F4C6BA"/>

    <!-- Tote Bag with Mushroom motif -->
    <g transform="translate(75, 105)">
      <!-- Tote Straps -->
      <path d="M 30 40 C 30 -10 100 -10 100 40" fill="none" stroke="#D5BCAF" stroke-width="8"/>
      <!-- Tote Body -->
      <rect x="15" y="40" width="100" height="110" rx="12" fill="#FAF6EE" stroke="#3D2E2B" stroke-width="3"/>
      
      <!-- Mushroom Motif -->
      <!-- Stem -->
      <path d="M 55 105 C 55 85 75 85 75 105 Z" fill="#F4F1EA"/>
      <!-- Cap -->
      <path d="M 40 85 Q 65 50 90 85 Z" fill="#E85A4F"/>
      <circle cx="55" cy="72" r="3" fill="#FFFFFF"/>
      <circle cx="75" cy="70" r="3.5" fill="#FFFFFF"/>
      <circle cx="65" cy="80" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- PDF Icon Tag -->
    <g transform="translate(160, 220)">
      <rect width="70" height="40" rx="8" fill="#E85A4F"/>
      <text x="35" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PDF</text>
    </g>
  </g>

  <!-- Tag badge -->
  <rect x="20" y="20" width="105" height="32" rx="16" fill="#E85A4F"/>
  <text x="72" y="41" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Digital PDF</text>
</svg>
