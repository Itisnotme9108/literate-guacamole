<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="30" fill="#FFFBEB"/>
  
  <g transform="translate(0, 15)">
    <!-- Bunny Floppy Ears -->
    <path d="M 120 180 C 70 120 40 180 95 240 Z" fill="#F4F1EA" stroke="#DCD6C9" stroke-width="4"/>
    <path d="M 115 185 C 75 135 55 185 98 230 Z" fill="#FCE4E6"/>
    
    <path d="M 280 180 C 330 120 360 180 305 240 Z" fill="#F4F1EA" stroke="#DCD6C9" stroke-width="4"/>
    <path d="M 285 185 C 325 135 345 185 302 230 Z" fill="#FCE4E6"/>

    <!-- Bunny Body -->
    <ellipse cx="200" cy="280" rx="70" ry="75" fill="#F4F1EA" stroke="#DCD6C9" stroke-width="4"/>
    
    <!-- Yellow Overalls -->
    <path d="M 140 250 L 260 250 L 255 345 L 145 345 Z" fill="#F7C844" rx="10"/>
    <rect x="155" y="220" width="16" height="35" fill="#E6B325" rx="4"/>
    <rect x="229" y="220" width="16" height="35" fill="#E6B325" rx="4"/>
    <circle cx="163" cy="255" r="4" fill="#FFFFFF"/>
    <circle cx="237" cy="255" r="4" fill="#FFFFFF"/>

    <!-- Head -->
    <circle cx="200" cy="170" r="65" fill="#F4F1EA" stroke="#DCD6C9" stroke-width="4"/>

    <!-- Snout & Nose -->
    <polygon points="193,172 207,172 200,180" fill="#E899A2" rx="2"/>
    <path d="M 200 180 L 200 187 M 194 187 Q 200 192 206 187" stroke="#3D2E2B" stroke-width="2.5" fill="none"/>

    <!-- Eyes -->
    <circle cx="170" cy="160" r="6" fill="#3D2E2B"/>
    <circle cx="168" cy="158" r="2" fill="#FFFFFF"/>
    <circle cx="230" cy="160" r="6" fill="#3D2E2B"/>
    <circle cx="228" cy="158" r="2" fill="#FFFFFF"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="150" cy="175" rx="10" ry="6" fill="#F4B4BA" opacity="0.6"/>
    <ellipse cx="250" cy="175" rx="10" ry="6" fill="#F4B4BA" opacity="0.6"/>
  </g>

  <!-- Tag badge -->
  <rect x="20" y="20" width="110" height="32" rx="16" fill="#A8C3A0"/>
  <text x="75" y="41" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Physical Item</text>
</svg>
