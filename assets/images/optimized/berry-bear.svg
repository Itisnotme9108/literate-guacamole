<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="30" fill="#FDF3E7"/>
  <!-- Decorative stitches pattern background -->
  <pattern id="stitch-bg" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1.5" fill="#E6D3C2" opacity="0.6"/>
  </pattern>
  <rect width="400" height="400" fill="url(#stitch-bg)"/>
  
  <!-- Bear head and ears -->
  <g transform="translate(0, 10)">
    <!-- Ears -->
    <circle cx="130" cy="130" r="35" fill="#E899A2" stroke="#D37E88" stroke-width="4"/>
    <circle cx="130" cy="130" r="20" fill="#FAD4D8"/>
    <circle cx="270" cy="130" r="35" fill="#E899A2" stroke="#D37E88" stroke-width="4"/>
    <circle cx="270" cy="130" r="20" fill="#FAD4D8"/>

    <!-- Head -->
    <ellipse cx="200" cy="190" rx="85" ry="75" fill="#E899A2" stroke="#D37E88" stroke-width="5"/>

    <!-- Snout -->
    <ellipse cx="200" cy="205" rx="35" ry="25" fill="#FFF2F4"/>
    <polygon points="190,195 210,195 200,208" fill="#3D2E2B" rx="3"/>
    <path d="M 200 208 L 200 216 M 194 216 Q 200 221 206 216" stroke="#3D2E2B" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Eyes -->
    <circle cx="165" cy="175" r="7" fill="#3D2E2B"/>
    <circle cx="163" cy="173" r="2.5" fill="#FFFFFF"/>
    <circle cx="235" cy="175" r="7" fill="#3D2E2B"/>
    <circle cx="233" cy="173" r="2.5" fill="#FFFFFF"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="145" cy="195" rx="12" ry="7" fill="#F4B4BA" opacity="0.7"/>
    <ellipse cx="255" cy="195" rx="12" ry="7" fill="#F4B4BA" opacity="0.7"/>

    <!-- Strawberry detail -->
    <g transform="translate(180, 275) scale(0.7)">
      <path d="M 25 10 Q 5 25 10 45 Q 25 65 30 65 Q 35 65 50 45 Q 55 25 35 10 Z" fill="#E65B65"/>
      <path d="M 20 12 Q 30 0 40 12 Q 30 15 20 12 Z" fill="#88B04B"/>
      <!-- Seeds -->
      <circle cx="23" cy="30" r="1.5" fill="#FFE599"/>
      <circle cx="37" cy="32" r="1.5" fill="#FFE599"/>
      <circle cx="30" cy="45" r="1.5" fill="#FFE599"/>
    </g>

    <!-- Stitch detail overlays -->
    <path d="M 140 170 Q 200 130 260 170" fill="none" stroke="#FFFFFF" stroke-dasharray="4,6" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Tag badge -->
  <rect x="20" y="20" width="110" height="32" rx="16" fill="#A8C3A0"/>
  <text x="75" y="41" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Physical Item</text>
</svg>
