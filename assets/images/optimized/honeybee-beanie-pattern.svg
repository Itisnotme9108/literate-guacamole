<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="30" fill="#FFFBEB"/>
  
  <g transform="translate(60, 40)">
    <rect x="30" y="20" width="220" height="280" rx="16" fill="#FFFFFF" stroke="#F7C844" stroke-width="4" filter="drop-shadow(0px 8px 16px rgba(61,46,43,0.06))"/>
    <path d="M 210 20 L 250 60 L 210 60 Z" fill="#FFF3CD"/>
    <path d="M 210 20 L 250 60" stroke="#F7C844" stroke-width="3" fill="none"/>

    <rect x="55" y="50" width="130" height="14" rx="7" fill="#F7C844"/>
    <rect x="55" y="72" width="90" height="8" rx="4" fill="#FDE49A"/>

    <!-- Honeybee Beanie illustration -->
    <g transform="translate(75, 110)">
      <!-- Beanie main body -->
      <path d="M 15 80 C 15 10 115 10 115 80 Z" fill="#3D2E2B"/>
      <!-- Yellow Honeycomb stripes -->
      <path d="M 20 65 Q 65 45 110 65" stroke="#F7C844" stroke-width="8" fill="none"/>
      <path d="M 28 45 Q 65 30 102 45" stroke="#F7C844" stroke-width="8" fill="none"/>
      
      <!-- Pom Pom -->
      <circle cx="65" cy="18" r="16" fill="#F7C844"/>
      <circle cx="65" cy="18" r="12" fill="#FFE599"/>

      <!-- Ribbed Folded Brim -->
      <rect x="10" y="75" width="110" height="25" rx="6" fill="#F7C844" stroke="#3D2E2B" stroke-width="2"/>
      <line x1="25" y1="75" x2="25" y2="100" stroke="#3D2E2B" stroke-width="2"/>
      <line x1="45" y1="75" x2="45" y2="100" stroke="#3D2E2B" stroke-width="2"/>
      <line x1="65" y1="75" x2="65" y2="100" stroke="#3D2E2B" stroke-width="2"/>
      <line x1="85" y1="75" x2="85" y2="100" stroke="#3D2E2B" stroke-width="2"/>
      <line x1="105" y1="75" x2="105" y2="100" stroke="#3D2E2B" stroke-width="2"/>
    </g>

    <!-- PDF Icon Tag -->
    <g transform="translate(160, 220)">
      <rect width="70" height="40" rx="8" fill="#E85A4F"/>
      <text x="35" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PDF</text>
    </g>
  </g>

  <!-- Tag badge -->
  <rect x="20" y="20" width="105" height="32" rx="16" fill="#E85A4F"/>
  <text x="72" y="41" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Digital PDF</text>
</svg>
