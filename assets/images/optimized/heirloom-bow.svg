<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <rect width="600" height="800" fill="#FAF7F2"/>
  <rect x="20" y="20" width="560" height="760" fill="#F5EFE9" rx="8"/>
  <circle cx="300" cy="360" r="180" fill="#F4E8E5"/>
  <g transform="translate(150, 240)">
    <!-- Crochet Scalloped Bow Wings -->
    <path d="M 150 120 C 20 20, -10 200, 150 120 Z" fill="#C88A7E"/>
    <path d="M 150 120 C 280 20, 310 200, 150 120 Z" fill="#C88A7E"/>
    <!-- Scallop details -->
    <circle cx="60" cy="80" r="12" fill="#E6B8AF"/>
    <circle cx="240" cy="80" r="12" fill="#E6B8AF"/>
    <!-- Tails -->
    <path d="M 135 130 Q 70 280 30 350 L 75 350 Q 145 220 150 130 Z" fill="#B5776B"/>
    <path d="M 165 130 Q 230 280 270 350 L 225 350 Q 155 220 150 130 Z" fill="#B5776B"/>
    <!-- Center Knot -->
    <rect x="130" y="105" width="40" height="30" rx="10" fill="#2C2523"/>
  </g>
  <text x="300" y="670" font-family="Georgia, serif" font-size="22" fill="#2C2523" text-anchor="middle">The Heirloom Velvet Bow</text>
  <text x="300" y="700" font-family="sans-serif" font-size="14" fill="#C88A7E" text-anchor="middle">HANDMADE CROCHET</text>
</svg>
